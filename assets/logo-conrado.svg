<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" role="img" aria-label="Conrado Brigaderia">
  <!-- Sharp-corner artisanal badge lockup -->
  <g>
    <!-- Solid 3D offset plate -->
    <rect x="6" y="10" width="60" height="60" fill="#292a2c"/>
    <rect x="2" y="6" width="60" height="60" fill="#ffc700" stroke="#292a2c" stroke-width="3"/>
    <!-- Handcrafted pleated paper cup & brigadeiro truffle -->
    <polygon points="16,42 48,42 43,58 21,58" fill="#fdbeba" stroke="#292a2c" stroke-width="2.5" stroke-linejoin="miter"/>
    <line x1="25" y1="42" x2="27" y2="58" stroke="#292a2c" stroke-width="2"/>
    <line x1="32" y1="42" x2="32" y2="58" stroke="#292a2c" stroke-width="2"/>
    <line x1="39" y1="42" x2="37" y2="58" stroke="#292a2c" stroke-width="2"/>
    <!-- Truffle dome -->
    <circle cx="32" cy="31" r="14" fill="#3b1d12" stroke="#292a2c" stroke-width="2.5"/>
    <!-- Gloss highlight -->
    <path d="M23 25 A10 10 0 0 1 32 20" fill="none" stroke="#fee3c1" stroke-width="2.5" stroke-linecap="square"/>
    <!-- Geometric golden & blush sprinkles -->
    <rect x="25" y="29" width="5" height="2.2" transform="rotate(-24 27.5 30)" fill="#ffc700"/>
    <rect x="33" y="25" width="5" height="2.2" transform="rotate(32 35.5 26)" fill="#fdbeba"/>
    <rect x="35" y="33" width="5" height="2.2" transform="rotate(-15 37.5 34)" fill="#ffc700"/>
    <rect x="26" y="36" width="4.5" height="2.2" transform="rotate(20 28 37)" fill="#ff4100"/>
  </g>

  <!-- Wordmark with solid 3D offset shadow (no blur) -->
  <g font-family="'Bowlby One SC', 'Space Grotesk', Impact, sans-serif" font-weight="900">
    <text x="80" y="42" font-size="35" letter-spacing="-1.2" fill="#292a2c">CONRADO</text>
    <text x="77" y="39" font-size="35" letter-spacing="-1.2" fill="#ffc700" stroke="#292a2c" stroke-width="1.5" paint-order="stroke">CONRADO</text>
  </g>

  <!-- Sharp subtitle bar -->
  <rect x="78" y="48" width="270" height="20" fill="#292a2c"/>
  <text x="87" y="62" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="11.5" letter-spacing="2.6" fill="#fee3c1">BRIGADERIA ARTESANAL • SANTOS</text>
</svg>
