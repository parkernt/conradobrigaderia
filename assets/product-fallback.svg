<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Imagem ilustrativa Conrado Brigaderia">
  <!-- Background Cream & geometric stripes -->
  <rect width="400" height="300" fill="#fee3c1"/>
  <rect x="0" y="232" width="400" height="68" fill="#fdbeba"/>
  <line x1="0" y1="232" x2="400" y2="232" stroke="#292a2c" stroke-width="4"/>

  <!-- Decorative starburst corner -->
  <polygon points="348,20 356,36 374,28 366,46 384,54 366,62 374,80 356,72 348,88 340,72 322,80 330,62 312,54 330,46 322,28 340,36" fill="#ffc700" stroke="#292a2c" stroke-width="2.5" stroke-linejoin="miter"/>

  <!-- Hard shadow plate -->
  <rect x="114" y="198" width="180" height="16" fill="#292a2c"/>
  <rect x="108" y="192" width="180" height="16" fill="#ffc700" stroke="#292a2c" stroke-width="3"/>

  <!-- Pleated brigadeiro liner -->
  <polygon points="140,140 256,140 242,192 154,192" fill="#ff4100" stroke="#292a2c" stroke-width="3.5" stroke-linejoin="miter"/>
  <line x1="164" y1="140" x2="170" y2="192" stroke="#292a2c" stroke-width="2.5"/>
  <line x1="198" y1="140" x2="198" y2="192" stroke="#292a2c" stroke-width="2.5"/>
  <line x1="232" y1="140" x2="226" y2="192" stroke="#292a2c" stroke-width="2.5"/>

  <!-- Glossy Belgian chocolate truffle -->
  <circle cx="198" cy="106" r="48" fill="#3b1d12" stroke="#292a2c" stroke-width="4"/>
  <!-- Ganache sheen -->
  <path d="M168 86 A36 36 0 0 1 198 69" fill="none" stroke="#fee3c1" stroke-width="5" stroke-linecap="square"/>
  <rect x="208" y="70" width="7" height="7" fill="#fee3c1"/>

  <!-- Artisanal sprinkles -->
  <rect x="166" y="106" width="16" height="6" transform="rotate(-22 174 109)" fill="#ffc700" stroke="#292a2c" stroke-width="1.5"/>
  <rect x="196" y="88" width="16" height="6" transform="rotate(28 204 91)" fill="#fdbeba" stroke="#292a2c" stroke-width="1.5"/>
  <rect x="208" y="114" width="16" height="6" transform="rotate(-14 216 117)" fill="#ffc700" stroke="#292a2c" stroke-width="1.5"/>
  <rect x="176" y="124" width="15" height="6" transform="rotate(18 183 127)" fill="#ff4100" stroke="#292a2c" stroke-width="1.5"/>
  <rect x="194" y="104" width="12" height="5" transform="rotate(62 200 106)" fill="#5a2c1c" stroke="#292a2c" stroke-width="1.5"/>

  <!-- Label banner -->
  <rect x="86" y="250" width="228" height="28" fill="#292a2c"/>
  <text x="200" y="269" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="2" fill="#ffc700">CONRADO BRIGADERIA</text>
</svg>
